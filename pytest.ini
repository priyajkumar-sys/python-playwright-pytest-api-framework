[pytest]

# ---------------------------------------------------
# TEST DISCOVERY
# ---------------------------------------------------

# Directories pytest searches for test cases.
test_paths =
    ui_tests
    api_tests

# Only discover Python files starting with "test_".
python_files = test_*.py

# ---------------------------------------------------
# DEFAULT EXECUTION SETTINGS
# ---------------------------------------------------

# -v               : Display detailed test results.
# --browser chromium: Execute UI tests using Chromium.
# --base-url        : Default URL for SauceDemo tests.
#
# These options are applied automatically when pytest runs.
addopts = -v --browser chromium --base-url https://www.saucedemo.com

# ---------------------------------------------------
# CUSTOM TEST MARKERS
# ---------------------------------------------------

# Markers categorize tests and allow selective execution.
#
# Example:
# @pytest.mark.smoke
# def test_valid_login():
#     ...
#
# Run only smoke tests:
# python3 -m pytest -m smoke
markers =
    smoke: Critical application functionality
    regression: Full regression tests
    login: Authentication tests
    inventory: Product inventory tests
    cart: Shopping cart tests
    checkout: Checkout tests